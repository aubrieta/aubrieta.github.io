<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>example list | aubrieta</title>
    <link rel="stylesheet" href="../styles.css?v=20260624">
    <link rel="stylesheet" href="lists.css?v=20260624">
</head>
<body>
    <main class="page-shell page-shell-single">
        <section class="intro intro-stack" aria-labelledby="list-heading">
            <div class="intro-copy">
                <p class="kicker"><a href="index.html">all lists</a> / <a href="../index.html">home</a></p>
                <h1 class="list-title" id="list-heading">Example List</h1>
                <p class="lede list-lede" id="list-lede">A small sample page using the shared list format.</p>
                <p class="list-header-meta" id="list-header-meta" hidden></p>
            </div>
        </section>

        <section class="notes list-notes" aria-label="List contents">
            <article class="list-sheet">
                <div class="list-page-note" id="list-page-note" hidden></div>
                <div id="list-items"></div>
            </article>
        </section>
    </main>

    <script>
        window.LIST_PAGE = {
            title: "Example List",
            intro: "This one is numbered, but you can switch it to bullets in one line.",
            listType: "ordered",
            date: "June 24, 2026",
            location: "Paris",
            pageNote: "This page shows the optional fields. Delete anything you do not want on your own list.",
            entries: [
                {
                    text: "Pick a title and a short intro.",
                    note: "The intro is optional, but it helps if the list needs a little context."
                },
                {
                    text: "Choose numbered or unnumbered items.",
                    note: "Change listType to unordered if you want bullets instead."
                },
                {
                    content: "Add links whenever they are useful, like a pointer back to the <a href=\"../index.html\">homepage</a>.",
                    date: "June 25, 2026"
                },
                {
                    text: "Leave metadata blank when you do not need it.",
                    location: "Anywhere"
                }
            ]
        };
    </script>
    <script src="list-page.js?v=20260624"></script>
