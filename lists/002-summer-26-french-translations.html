    <script>
        window.LIST_PAGE = {
            title: "Summer 2026 French translations",
            intro: "Here are some interesting translation choices I noticed in France with my notes.",
            listType: "unordered",
            // date: "June 24, 2026",
            // location: "Paris",
            // pageNote: "This page shows the optional fields. Delete anything you do not want on your own list.",
            entries: [
                    {   
                    text: "La peinture, seule : Painting alone",
                    date: "June 19, 2026",
                    location: "Musée National Picasso-Paris",
                    noteHtml: "This was in an expository piece of text on the wall of a room. Where did the comma go? Why not \"Peindre seul\"? I suppose \"Painting, alone\" isn't very idiomatic in English... but I like the comma, I think it adds pause and gravitas." 
                },

                {
                    text: "Merci de maintenir les vitres fermées : Keep windows closed",
                    date: "June 21, 2026",
                    location: "RER",
                    noteHtml: "This is from a sign on the train. A more literal translation would be \"Thank you for keeping windows closed\", so I am very struck by the imperative used in the English version and the politeness of the French. In fact, there are other languages: the Italian is polite, and the German and Spanish are in the imperative." 
                },
                {
                    text: "\"Voglio vedere le mie montagne\" : \"Je veux revoir mes montagnes\": \"I want to see my mountains again\"",
                    date: "June 27, 2026",
                    location: "Musée Marmottan Monet",
                    noteHtml: "These are the last words of Giovanni Segrantini, an Italian painter, who is the focus of a temporary exhibition at the museum. The source text is Segrantini's Italian. I don't understand why the French is translated as \"revoir\" instead of \"voir\". It is not a literal translation. I think there is a translation loss here --- do we have reason to believe that Segrantini wanted to see mountains he had already seen before? <br> <br> I wonder if the English was translated directly from the French instead of with reference to the Italian. Or maybe there's some context I'm missing altogether."
                },
                {
                    text: "\"Everything we do today, Méliès did before us.\" Martin Scorsese : « On descend tous de Méliès » (Martin Scorsese)",
                    date: "June 27, 2026",
                    location: "Musée Méliès",
                    noteHtml: "The Musée Méliès is in La Cinémathèque Française. It's stunning, I had the most fun. I found this translation choice on a little postcard near the entrance. It's clear that the source text is the English version. I found it interesting that the translator took a lot of creative liberties with a quote; I would have expected it to be more literal, something like \"Tout ce que nous faisons aujourd'hui, Méliès l'a fait avant nous\" so as to not add interpretation to someone else's exact words. <br><br>It's also interesting how the quote attribution is displayed --- the English version is plainly stated at the end, and the French version is in parentheses. I wonder if this is a common convention in French, or if it is just a stylistic choice, subconscious or otherwise. <br> <br> Okay, last thing, and I just noticed this: on the actual museum wall, I think the English version translated the (incorrect?) French version of the quote. The English text claims that Scorsese said \"We all descend from Méliès!\" which I don't think is correct! In any case, one of the English translations is a complete failure. Yet another testament to the need for careful and human translation."
                    
                },
                {
                    text: "Truth. Justice. Whatever. : Verité. Justice. Et tout le blabla.",
                    date: "June 28, 2026",
                    location: "Supergirl movie poster",
                    noteHtml: "A more direct translation of \"whatever\" would be \"peu importe\" or \"n'importe quoi\" or \"ça m'égal\". What's interesting to me is that there is no mention of \"blabla\" anywhere on WordReference under the English definition of \"whatever\". This is a pretty creative translation choice, and I actually like it. I think the closest English equivalent of \"Et tout le blabla\" is \"and all that jazz\". Or maybe even more derogatory, something like \"and all that blathering\" or even \"blah blah blah\". I would guess that ultimately this choice came down to the fact that more direct translations of \"whatever\" would have expressed a lack of import, when it's really supposed to express a lack of interest."
                }
