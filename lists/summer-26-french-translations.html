<body>
    <main class="page-shell page-shell-single">
        <section class="intro intro-stack" aria-labelledby="list-heading">
            <div class="intro-copy">
                <p class="kicker"><a href="index.html">all lists</a> / <a href="../index.html">home</a></p>
                <h1 class="list-title" id="list-heading">Summer 2026 French vocabulary</h1>
                <p class="lede list-lede" id="list-lede"></p>
                <p class="list-header-meta" id="list-header-meta" hidden></p>
            </div>
        </section>

        <section class="notes list-notes" aria-label="List contents">
            <article class="list-sheet">
                <p class="list-page-note" id="list-page-note" hidden></p>
                <div id="list-items"></div>
            </article>
        </section>
    </main>

    <script>
        window.LIST_PAGE = {

                    {   
                    text: "La peinture, seule: Painting alone",
                    date: "June 19, 2026",
                    location: "Musée National Picasso-Paris",
                    noteHtml: "This was in an expository piece of text on the wall of a room. Where did the comma go? Why not \"Peindre seul\"? I suppose \"Painting, alone\" isn't very idiomatic in English... but I like the comma, I think it adds pause and gravitas." 
                },

                {
                    text: "Merci de maintenir les vitres fermées: Keep windows closed",
                    date: "June 21, 2026",
                    location: "RER",
                    noteHtml: "This is from a sign on the train. A more literal translation would be \"Thank you for keeping windows closed\", so I am very struck by the imperative used in the English version and the politeness of the French. In fact, there were other languages: the Italian was polite, and the German and Spanish were in the imperative."
