<body>
    <main class="page-shell page-shell-single">
        <section class="intro intro-stack" aria-labelledby="list-heading">
            <div class="intro-copy">
                <p class="kicker"><a href="index.html">all lists</a> / <a href="../index.html">home</a></p>
                <h1 class="list-title" id="list-heading">Summer 2026 French vocabulary</h1>
                <p class="lede list-lede" id="list-lede"></p>
                <p class="list-header-meta" id="list-header-meta" hidden></p>
            </div>
        </section>

        <section class="notes list-notes" aria-label="List contents">
            <article class="list-sheet">
                <p class="list-page-note" id="list-page-note" hidden></p>
                <div id="list-items"></div>
            </article>
        </section>
    </main>

    <script>
        window.LIST_PAGE = {
            title: "Summer 2026 French vocabulary",
            intro: "Here's some new vocabulary I learned in France with my notes.",
            listType: "unordered",
            // date: "June 24, 2026",
            // location: "Paris",
            // pageNote: "This page shows the optional fields. Delete anything you do not want on your own list.",
            entries: [
                {
                    text: "une myrtille: a blueberry",
                    date: "June 1, 2026",
                    location: "Starbucks, CDG",
                    noteHtml: "I tried to buy a blueberry muffin and realized I was at a loss for words. I can't believe that in years and years of French classes, this fruit never came up!"
                },
                {
                    text: "éternuer: to sneeze",
                    date: "June 2, 2026",
                    location: "RER",
                    noteHtml: "There was an ad for some English learning tool on the train that said something like \"tu peux donc dire « through » sans avoir l'air d'éternuer\". The word for sneeze is \"un éternuement\"."
                },
                {
                    text: "l'avoine (m.): oat",
                    date: "June 2, 2026",
                    location: "Moelleux Café",
                    noteHtml: "A little coffee break before the Trianon and I didn't know how to order a drink with oat milk. So I asked for almond milk, and the barista said she didn't have any, and then said she would use something else that I didn't understand. Turns out she was indeed saying \"avoine\" so everything worked out! To ask for oat milk, say \"lait d'avoine\"."
                },
                {
                    text: "un après-shampoing: a conditioner",
                    date: "June 3, 2026",
                    location: "Franprix",
                    noteHtml: "I searched and searched and couldn't see the word \"conditioner\". Came to the conclusion that they just don't use conditioner in France. But turns out I should have been looking for \"after-shampoo\" instead! Note the single \"o\" in \"shampoing\". The word \"shampooing\" is used in French, but it refers to the act of shampooing, not the product itself."
                },
                {
                    text: "un ticket: a receipt",
                    date: "June 3, 2026",
                    location: "Franprix",
                    noteHtml: "I learned \"reçu\" in school but I think that is more like a receipt for a payment. The word \"ticket\" is used almost always for receipts in stores."
                },

                {
                    text: "un canelé/cannelé: a canelé",
                    date: "June 17, 2026",
                    location: "Polytechnique",
                    noteHtml: "This was the snack someone brought for after lunch. Little chewy dessert from Bordeaux soaked in rum."
                },

                {
                    text: "une étreinte: an embrace",
                    date: "June 19, 2026",
                    location: "Musée National Picasso-Paris",
                    noteHtml: "I saw the 1970 painting L’Étreinte at the museum. Probably from the Latin \"strictus\" which means tight. The verb \"s'étreindre\" means to embrace."
                },

                {
                    text: "une facture: a receipt (of services)",
                    date: "June 20, 2026",
                    location: "Hotel in Le Havre",
                    noteHtml: "Genuinely didn't know this word! Had never heard of it! It's more like an invoice for services offered, so it's more appropriate for a hotel than something like a grocery store. From Latin \"facere\" which means to do or make."
                },

                {
                    text: "un chiffrement: an encryption",
                    date: "June 22, 2026",
                    location: "Polytechnique",
                    noteHtml: "Heard this at a thesis defense in the morning. The student was giving a brief overview of cryptography. Likewise, the word for decryption is \"déchiffrement\". From Latin \"cifra\" which means zero, and the root of the word cipher; to encrypt is \"chiffrer\" and to decrypt is \"déchiffrer\"."
                },

                {
                    text: "une chouquette: a chouquette",
                    date: "June 22, 2026",
                    location: "Polytechnique",
                    noteHtml: "Another snack someone brought for after lunch. A little puff pastry with flaky sugar on top. From the word \"chou\" which means cabbage, because of the shape. But it's hollow, not filled."
                },

                {
                    text: "une vitre: a window pane",
                    date: "June 24, 2026",
                    location: "RER",
                    noteHtml: "I'd only been exposed to the word for window, which is \"fenêtre\". From what I understand, this represents the larger whole of the window, whereas \"vitre\" is really the part that opens and closes. For example, you can have window panes on windows, as in \"les vitres de la fenêtre.\"" 
                },
                {
                    text: "une enceinte: a speaker",
                    date: "June 24, 2026",
                    location: "FNAC in La Défense",
                    noteHtml: "It's interesting that the word for \"speaker\" is the same as the word for \"pregnant\".  <a href=\"https://french.stackexchange.com/questions/50680/why-does-enceinte-mean-both-pregnant-and-speaker\">Here</a>'s a link to a StackExchange post about it. The idea is that they both indicate the root, which means enclosure. A woman is enclosed, carrying something while pregnant. The speaker enclosure is shorthand for the bounded space that the sound and tech is contained in."
                },
                {
                    text: "la Coupe du monde: the World Cup",
                    date: "June 24, 2026",
                    location: "All the ads...",
                    noteHtml: "This one I could easily translate back into English, but my original guess for the French was \"la coupe mondiale\". I made this mistake at a restaurant. Oops. Also note the capitalization on \"Coupe\" and not on \"monde\"."
                },
                // {
                //     content: "Add links whenever they are useful, like a pointer back to the <a href=\"../index.html\">homepage</a>.",
                //     date: "June 25, 2026"
                // },
                // {
                //     text: "Leave metadata blank when you do not need it.",
                //     location: "Anywhere"
                // }
            ]
        };
    </script>
