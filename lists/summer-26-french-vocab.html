<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>example list | aubrieta</title>
    <link rel="stylesheet" href="../styles.css?v=20260624">
    <link rel="stylesheet" href="lists.css?v=20260624">
</head>
<body>
    <main class="page-shell page-shell-single">
        <section class="intro intro-stack" aria-labelledby="list-heading">
            <div class="intro-copy">
                <p class="kicker"><a href="index.html">all lists</a> / <a href="../index.html">home</a></p>
                <h1 class="list-title" id="list-heading">Summer 2026 French vocabulary</h1>
                <p class="lede list-lede" id="list-lede"></p>
                <p class="list-header-meta" id="list-header-meta" hidden></p>
            </div>
        </section>

        <section class="notes list-notes" aria-label="List contents">
            <article class="list-sheet">
                <p class="list-page-note" id="list-page-note" hidden></p>
                <div id="list-items"></div>
            </article>
        </section>
    </main>

    <script>
        window.LIST_PAGE = {
            title: "Summer 2026 French vocabulary",
            intro: "Here's some new vocabulary I learned in France with my notes.",
            listType: "unordered",
            // date: "June 24, 2026",
            // location: "Paris",
            // pageNote: "This page shows the optional fields. Delete anything you do not want on your own list.",
            entries: [
                 {
                    text: "une étreinte: an embrace",
                    date: "June 19, 2026",
                    location: "Musée National Picasso-Paris",
                    noteHtml: "I saw the 1970 painting L’Étreinte at the museum. Probably from the Latin \"strictus\" which means tight. The French verb \"s'étreindre\" means to embrace."
                },
                {
                    text: "une vitre: a window pane",
                    date: "June 21, 2026",
                    location: "RER",
                    noteHtml: "I'd only been exposed to the word for window, which is \"fenêtre\". From what I understand, this represents the larger whole of the window, whereas \"vitre\" is really the part that opens and closes. For example, you can have window panes on windows, as in \"les vitres de la fenêtre.\"" 
                },


                {
                    text: "une enceinte: speaker",
                    date: "June 25, 2026",
                    location: "FNAC in La Défense",
                    noteHtml: "It's interesting that the word for \"speaker\" is the same as the word for \"pregnant\".  <a href=\"https://french.stackexchange.com/questions/50680/why-does-enceinte-mean-both-pregnant-and-speaker\">Here</a>'s a link to a StackExchange post about it. The idea is that they both indicate the root, which means enclosure. A woman is enclosed, carrying something while pregnant. The speaker enclosure is shorthand for the bounded space that the sound and tech is contained in."
                },
                {
                    text: "la coupe du monde: World Cup",
                    date: "June 25, 2026",
                    location: "All the ads...",
                    noteHtml: "This one I could easily translate back into English, but my original guess for the French was \"la coupe mondiale\". I made this mistake at a restaurant. Oops."
                },
                // {
                //     content: "Add links whenever they are useful, like a pointer back to the <a href=\"../index.html\">homepage</a>.",
                //     date: "June 25, 2026"
                // },
                // {
                //     text: "Leave metadata blank when you do not need it.",
                //     location: "Anywhere"
                // }
            ]
        };
    </script>
    <script src="list-page.js?v=20260624"></script>
</body>
</html>
