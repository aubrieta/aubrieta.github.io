<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>template list | aubrieta</title>
    <link rel="stylesheet" href="../styles.css?v=20260624">
    <link rel="stylesheet" href="lists.css?v=20260624">
</head>
<body>
    <main class="page-shell page-shell-single">
        <section class="intro intro-stack" aria-labelledby="list-heading">
            <div class="intro-copy">
                <p class="kicker"><a href="index.html">all lists</a> / <a href="../index.html">home</a></p>
                <h1 class="list-title" id="list-heading">Template List</h1>
                <p class="lede list-lede" id="list-lede">Copy this file and edit the data block below.</p>
                <p class="list-header-meta" id="list-header-meta" hidden></p>
            </div>
        </section>

        <section class="notes list-notes" aria-label="List contents">
            <article class="list-sheet">
                <div class="list-page-note" id="list-page-note" hidden></div>
                <div id="list-items"></div>
            </article>
        </section>
    </main>

    <script>
        window.LIST_PAGE = {
            // Change the title at the top of the page.
            title: "Template List",
            // Optional short intro below the title.
            intro: "Copy this file to make a new list page.",
            // Use \"ordered\" for numbers or \"unordered\" for bullets.
            listType: "unordered",
            // Optional page-level metadata.
            date: "",
            location: "",
            pageNote: "",
            // Blank lines inside pageNote become tighter paragraph breaks.
            // Use pageNoteHtml only if you want custom HTML like links.
            pageNoteHtml: "",
            // Each item can be a plain string or an object.
            entries: [
                {
                    text: "Replace this with your first item.",
                    note: "Add note, date, or location only when you want them."
                },
                {
                    content: "Use <code>content</code> instead of <code>text</code> if you want a <a href=\"../vita.html\">link</a> or other inline HTML."
                },
                {
                    text: "Use a blank line if you want a softer paragraph break in a note.",
                    note: "First paragraph.\n\nSecond paragraph."
                },
                {
                    text: "Switch listType to ordered if you want numbers.",
                    date: "",
                    location: ""
                }
            ]
        };
    </script>
    <script src="list-page.js?v=20260624"></script>
</body>
</html>
